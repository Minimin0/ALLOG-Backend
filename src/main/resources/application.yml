spring:
  application:
    name: allog-backend
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:allog}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    username: "${DB_USERNAME:allog}"
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
ai:
  openai:
    api-key: "${OPENAI_API_KEY:}"
  coach:
    model: "${AI_COACH_MODEL:}"
    timeout: "${AI_COACH_TIMEOUT:3s}"
allog:
  auth:
    firebase:
      enabled: "${FIREBASE_AUTH_ENABLED:false}"
      project-id: "${FIREBASE_PROJECT_ID:}"
  group:
    lifecycle:
      enabled: "${GROUP_LIFECYCLE_ENABLED:true}"
      reconcile-delay: "${GROUP_LIFECYCLE_RECONCILE_DELAY:60s}"
      batch-size: "${GROUP_LIFECYCLE_BATCH_SIZE:100}"
  verification:
    analysis:
      anthropic:
        enabled: "${VERIFICATION_ANALYSIS_ANTHROPIC_ENABLED:false}"
        api-key: "${ANTHROPIC_API_KEY:}"
        model: "${VERIFICATION_ANALYSIS_ANTHROPIC_MODEL:}"
        request-timeout: "${VERIFICATION_ANALYSIS_ANTHROPIC_REQUEST_TIMEOUT:30s}"
    media:
      enabled: "${VERIFICATION_MEDIA_ENABLED:false}"
      local-root: "${VERIFICATION_MEDIA_LOCAL_ROOT:}"
      local-base-url: "${VERIFICATION_MEDIA_LOCAL_BASE_URL:}"
      local-signing-secret: "${VERIFICATION_MEDIA_LOCAL_SIGNING_SECRET:}"
      max-bytes: "${VERIFICATION_MEDIA_MAX_BYTES:0}"
      upload-expiry: "${VERIFICATION_MEDIA_UPLOAD_EXPIRY:0s}"
      allowed-content-types: "${VERIFICATION_MEDIA_ALLOWED_CONTENT_TYPES:}"
