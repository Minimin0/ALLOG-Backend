spring:
  datasource:
    url: "jdbc:h2:mem:allog-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver
allog:
  auth:
    token:
      secret: "test-only-token-key-32-bytes-minimum"
  group:
    lifecycle:
      enabled: false
